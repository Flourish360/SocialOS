<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024"
     height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="64%">
      <stop offset="0%"   stop-color="#4318C4"/>
      <stop offset="100%" stop-color="#270890"/>
    </radialGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- ── Network connecting lines ─────────────────────────────── -->
  <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" fill="none">
    <line x1="487" y1="207" x2="268" y2="432"/>  <!-- top  → left        -->
    <line x1="487" y1="207" x2="478" y2="535"/>  <!-- top  → center      -->
    <line x1="268" y1="432" x2="478" y2="535"/>  <!-- left → center      -->
    <line x1="268" y1="432" x2="294" y2="685"/>  <!-- left → bottom-left -->
    <line x1="478" y1="535" x2="692" y2="535"/>  <!-- center → right          -->
    <line x1="478" y1="535" x2="294" y2="685"/>  <!-- center → bottom-left    -->
    <line x1="478" y1="535" x2="648" y2="698"/>  <!-- center → bottom-right   -->
    <line x1="478" y1="535" x2="478" y2="843"/>  <!-- center → bottom         -->
    <line x1="692" y1="535" x2="648" y2="698"/>  <!-- right  → bottom-right   -->
    <line x1="294" y1="685" x2="478" y2="843"/>  <!-- bottom-left  → bottom   -->
    <line x1="648" y1="698" x2="478" y2="843"/>  <!-- bottom-right → bottom   -->
  </g>

  <!-- ── Network nodes (drawn on top so they mask the lines) ──── -->
  <!-- fill approximates the radial-gradient at each node's position -->
  <g stroke="#FFFFFF" stroke-width="23">
    <circle cx="487" cy="207" r="34"  fill="#3016B8"/>  <!-- top          -->
    <circle cx="268" cy="432" r="34"  fill="#2E14A8"/>  <!-- left         -->
    <circle cx="478" cy="535" r="45"  fill="#3516B4"/>  <!-- center (hub) -->
    <circle cx="692" cy="535" r="34"  fill="#3016B0"/>  <!-- right        -->
    <circle cx="294" cy="685" r="34"  fill="#2C12A4"/>  <!-- bottom-left  -->
    <circle cx="648" cy="698" r="34"  fill="#2F14A8"/>  <!-- bottom-right -->
    <circle cx="478" cy="843" r="34"  fill="#2A1098"/>  <!-- bottom       -->
  </g>

  <!-- ── Sparkle accent dots ────────────────────────────────────── -->
  <circle cx="643" cy="208" r="17" fill="#A78BFA"/>   <!-- upper dot -->
  <circle cx="782" cy="428" r="12" fill="#A78BFA"/>   <!-- lower dot -->

  <!-- ── 4-pointed sparkle star ────────────────────────────────── -->
  <!-- Center (750,318), outer radius 100, waist offset 18         -->
  <path d="
    M 750,218
    C 768,300 768,300 850,318
    C 768,336 768,336 750,418
    C 732,336 732,336 650,318
    C 732,300 732,300 750,218
    Z"
    fill="url(#sparkle)"/>
</svg>
